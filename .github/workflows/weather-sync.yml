name: weather-sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency: weather-sync

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run weather:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          METEOGATE_API_KEY: ${{ secrets.METEOGATE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
